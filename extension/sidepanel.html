<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>NepaChrome AI Center</title>
    <style>
        body {
            background: #ffffff;
            color: #202124;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            padding: 32px;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        h1 { 
            color: #202124; 
            font-size: 22px; 
            font-weight: 500;
            margin: 0 0 24px 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .status-chip {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 16px;
            background: #f1f3f4;
            color: #5f6368;
            font-weight: 500;
            display: inline-block;
            margin-bottom: 32px;
        }
        .result-card {
            background: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            transition: box-shadow 0.2s;
        }
        .result-card:hover {
            box-shadow: 0 1px 3px rgba(60,64,67,0.3), 0 4px 8px 3px rgba(60,64,67,0.15);
        }
        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #70757a;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .content {
            font-size: 15px;
            line-height: 1.6;
            color: #3c4043;
        }
        #output-container {
            flex-grow: 1;
            overflow-y: auto;
        }
        .footer {
            padding-top: 24px;
            border-top: 1px solid #f1f3f4;
            display: flex;
            justify-content: flex-end;
        }
        button {
            background: #1a73e8;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #1765cc; }
        button:disabled { background: #f1f3f4; color: #9aa0a6; cursor: not-allowed; }
        
        #loading-state {
            color: #70757a;
            font-style: italic;
            text-align: center;
            margin-top: 100px;
        }
    </style>
</head>
<body>
    <h1>✨ NepaChrome AI</h1>
    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px;">
        <div id="model-status" class="status-chip">Checking local AI...</div>
        <div id="hub-status" class="status-chip" style="cursor: pointer;" title="Click to test connection or sync">Checking Hub...</div>
    </div>
    <div id="hub-notice" style="display: none; padding: 8px 12px; border-radius: 6px; font-size: 12px; margin-bottom: 16px; line-height: 1.4;"></div>

    <div id="output-container">
        <div id="loading-state">Select an action on the page to begin...</div>
    </div>

    <div class="footer">
        <button id="save-btn" disabled>Save to Sovereign Hub</button>
    </div>

    <script type="module" src="sidepanel.js"></script>
</body>
</html>
